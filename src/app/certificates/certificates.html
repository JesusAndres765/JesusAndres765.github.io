<div class="section-title">Certificates</div>
<ul class="cert-list">
  <li class="cert-item" *ngFor="let cert of certificates">
    <span class="cert-icon">🏅</span>
    <div class="cert-info">
      <div class="cert-title">
        <a *ngIf="cert.url" [href]="cert.url" target="_blank" rel="noopener noreferrer">{{cert.title}}</a>
        <span *ngIf="!cert.url">{{cert.title}}</span>
      </div>
      <div class="cert-meta">{{cert.issuer}} · {{cert.date}}</div>
    </div>
  </li>
</ul>
